name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest pyflakes certifi numpy pillow pymupdf
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu   # retriever tests
      - run: pyflakes eval train tests
      - run: pytest -q tests
